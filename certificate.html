<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate — Lars Résonance</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="preload" href="fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <style>
      :root { --ink: #0A1628; --gold: #A88E4E; --gold-light: #C2A45A; --paper: #FAF8F5; --muted: #7A756E; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { background: #E8E4DE; }
      body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; font-variant-numeric: oldstyle-nums; }
      .toolbar { max-width: 820px; margin: 24px auto 0; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
      .toolbar a, .toolbar button { color: var(--gold); background: none; border: 1px solid var(--gold); padding: 9px 16px; font: inherit; letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; cursor: pointer; text-decoration: none; }
      .sheet { position: relative; max-width: 820px; margin: 20px auto 60px; padding: clamp(40px, 6vw, 80px) clamp(28px, 6vw, 80px); background: var(--paper); border: 1px solid #D1CBC2; box-shadow: 0 30px 80px rgba(0,0,0,0.12); }
      .sheet::before { content: ''; position: absolute; inset: 14px; border: 1px solid rgba(168, 142, 78, 0.45); pointer-events: none; }
      .mark { display: flex; align-items: baseline; justify-content: center; gap: 10px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; letter-spacing: 0.3em; }
      .mark span:nth-child(2) { color: var(--gold-light); font-weight: 300; }
      .mark small { font-family: 'DM Sans', sans-serif; font-size: 9px; letter-spacing: 0.35em; color: var(--gold); }
      .kicker { margin: 44px 0 10px; text-align: center; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); }
      h1 { text-align: center; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(34px, 5vw, 52px); line-height: 1.1; text-wrap: balance; }
      .lede { max-width: 560px; margin: 22px auto 40px; text-align: center; font-size: 15px; line-height: 1.75; color: #3D3A36; }
      dl { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 40px; margin: 0 auto 40px; max-width: 620px; }
      dt { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
      dd { font-size: 16px; }
      .specs { max-width: 620px; margin: 0 auto 40px; border-top: 1px solid #D1CBC2; }
      .specs div { display: flex; justify-content: space-between; gap: 20px; padding: 10px 0; border-bottom: 1px solid #E8E4DE; font-size: 14px; }
      .specs dt { margin: 0; align-self: center; }
      .prov { max-width: 620px; margin: 0 auto 50px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.5; text-align: center; color: #3D3A36; }
      .sign { display: flex; justify-content: space-between; gap: 40px; max-width: 620px; margin: 0 auto; font-size: 12px; color: var(--muted); }
      .sign div { flex: 1; padding-top: 10px; border-top: 1px solid var(--ink); }
      .sign strong { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 400; font-size: 22px; color: var(--ink); margin-bottom: 4px; }
      .seal { position: absolute; right: clamp(28px, 6vw, 80px); bottom: clamp(40px, 6vw, 80px); width: 86px; height: 86px; border-radius: 50%; border: 1px solid var(--gold); display: grid; place-items: center; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); text-align: center; line-height: 1.5; transform: rotate(-8deg); }
      .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
      @media (max-width: 560px) { dl, .sign { grid-template-columns: 1fr; flex-direction: column; } .seal { display: none; } }
      @media print {
        html { background: #fff; }
        .toolbar { display: none; }
        .sheet { margin: 0; max-width: none; box-shadow: none; border: none; padding: 40px; }
        @page { margin: 12mm; size: A4; }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <a href="index.html" id="back">← Back to the atelier</a>
      <button type="button" id="print">Save as PDF / Print</button>
    </div>
    <main class="sheet" id="sheet">
      <p class="empty" id="empty" hidden>No instrument found for this certificate.</p>
    </main>
    <script type="module" src="js/certificate.js"></script>
  </body>
</html>
